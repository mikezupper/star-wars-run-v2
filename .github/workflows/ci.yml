# Runs LOCALLY only, and only when the owner asks: `pnpm ci:local` (gh act + Docker).
# See docs/design-docs/0006-workflow.md. Do not add push, pull_request or schedule triggers:
# scripts/check-workflows.mjs rejects them, because they would spend GitHub Actions minutes.
name: ci

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
