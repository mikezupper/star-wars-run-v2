# The production stack (ADR 0010): the site (Caddy: static files, and /api/* forwarded) and the
# API (Ask, the SQL editor, the question log). Build the images with `pnpm docker:build`, then
# `docker compose up -d` next to an .env that holds the model's settings (ASK_ORIGIN, ASK_KEY,
# ASK_MODEL; ADR 0009). The question log lives in the `questions` volume.
services:
  site:
    image: starwars-run
    ports:
      - '8080:8080'
    environment:
      API: http://api:8090
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  api:
    image: starwars-run-api
    env_file:
      - path: .env
        required: false
    volumes:
      - questions:/data
    restart: unless-stopped
volumes:
  questions:
