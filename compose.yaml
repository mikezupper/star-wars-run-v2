# The stack on your machine (`pnpm docker:run`): the site (Caddy: static files, and everything
# else forwarded) and the app (every page, Ask, the SQL editor, the question log). Build the
# images with `pnpm docker:build`. The images carry no data (ADR 0003): the app reads this
# checkout's last `pnpm build` from dist-api/, read-only. Ask's settings come from .env (ADR
# 0009); the question log lives in the `questions` volume. The server's file is
# deploy/compose.yml.
services:
  site:
    image: starwars-run
    ports:
      - '8080:8080'
    environment:
      API: http://api:8090
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  api:
    image: starwars-run-api
    env_file:
      - path: .env
        required: false
    volumes:
      - ./dist-api:/app/data:ro
      - questions:/data
    restart: unless-stopped
volumes:
  questions:
